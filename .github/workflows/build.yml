name: GuidedQuad C++ tests
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: guidedquad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Package GuidedQuad trial native CLI (Windows)
        if: matrix.os == 'windows-latest' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: guidedquad-trial-cli-windows-x64
          path: build/Release/guidedquad_cli.exe
          if-no-files-found: error
          retention-days: 30
      - name: Package GuidedQuad trial native CLI (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: guidedquad-trial-cli-linux-x64
          path: build/guidedquad_cli
          if-no-files-found: error
          retention-days: 30
      - name: Validate Blender addon Python
        run: python -m compileall -q blender/guidedquad_trial
      - name: Test addon tracker and guide interchange
        run: python -m unittest discover -s blender/tests -v
      - name: Build Blender addon ZIP
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: python scripts/package_blender_trial.py
      - name: Upload installable Blender trial addon
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: guidedquad-blender-trial-v039
          path: dist/guidedquad_trial_v0.3.9.zip
          if-no-files-found: error
      - name: Upload native engine for Blender trial
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: guidedquad-cli-${{ matrix.os }}
          path: |
            build/guidedquad_cli
            build/Release/guidedquad_cli
            build/Release/guidedquad_cli.exe
          if-no-files-found: error

      - name: Solver quality comparison (reference case)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_patch$"
      - name: BVH reprojection query diagnostics (reference case)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_projection$"
      - name: Persistent collision BVH speed comparison
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_refit$"
      - name: Dirty-face collision BVH benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_dirty$"

  sanitizer-check:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
