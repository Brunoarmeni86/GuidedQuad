name: GuidedQuad C++ tests
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: guidedquad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Solver quality comparison (reference case)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_patch$"
