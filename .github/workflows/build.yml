name: GuidedQuad C++ tests
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: guidedquad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Publish matching trial CLI
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: guidedquad-cli-${{ matrix.os }}
          path: |
            build/guidedquad_cli
            build/guidedquad_cli.exe
            build/Release/guidedquad_cli.exe
          if-no-files-found: error
      - name: Solver quality comparison (reference case)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_patch$"
      - name: BVH reprojection query diagnostics (reference case)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_projection$"
      - name: Persistent collision BVH speed comparison
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_refit$"
      - name: Dirty-face collision BVH benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build -C Release -V -R "^guidedquad_dirty$"

  trial-addon:
    name: Trial addon Python validation and ZIP packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile addon Python syntax
        run: python -m compileall -q blender/guidedquad_trial
      - name: Run privacy-safe tracker unit tests
        run: python -m unittest discover -s tests -p test_tracker.py -v
      - name: Package installable Blender trial addon
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          directory=Path("dist")
          directory.mkdir(exist_ok=True)
          with ZipFile(directory/"GuidedQuad_Trial_Addon.zip","w",ZIP_DEFLATED) as z:
              for name in ("__init__.py","tracker.py"):
                  p=Path("blender")/"guidedquad_trial"/name
                  z.write(p,arcname="guidedquad_trial/"+name)
          print("Created",directory/"GuidedQuad_Trial_Addon.zip")
          PY
      - name: Publish addon installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GuidedQuad_Blender_Trial_addon
          path: dist/GuidedQuad_Trial_Addon.zip
          if-no-files-found: error

  sanitizer-check:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
